<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Dispatch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B5CD5'/%3E%3Cpath d='M6 17h4l2.5-8 3.5 15 3-9 2 2h5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===========================================================================
   Dispatch

   Design brief: a rider opens this to answer one question -- "is my trip
   still fine?" -- and occasionally to look something up. So the top of the
   screen is an answer, not a chart, and everything else is reachable in one
   tap.

   Visual grounding is transit signage plus platform boards: route numbers set
   as real signage bullets, departure times in tabular figures so columns of
   times line up the way a printed board does, and exactly four status colours
   that map to the four decisions the system can make. One typeface (the
   system UI face, which is SF on Apple and Segoe on Windows) with hierarchy
   carried by size and weight rather than by mixing families.
   ========================================================================= */
:root{
  --bg:#fff; --wash:#F4F6F8; --raise:#fff; --line:#E3E7EC; --line2:#EEF1F4;
  --text:#0A1420; --dim:#5D6B7C; --faint:#8A97A6;
  --blue:#0B5CD5; --bluewash:#EAF1FD;
  --ok:#0E7C5A; --okwash:#E3F6EE;
  --warn:#8A5200; --warnwash:#FFF2D4;
  --bad:#B4231C; --badwash:#FDE8E6;
  --grey:#5D6B7C; --greywash:#EDF0F3;
  --shadow:0 1px 2px rgba(10,20,32,.06),0 8px 24px -12px rgba(10,20,32,.18);
  --r:14px; --r2:10px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",
      Roboto,"Helvetica Neue",sans-serif;
  --rail:232px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1017; --wash:#121926; --raise:#151E2C; --line:#24303F; --line2:#1B2531;
    --text:#E9EFF6; --dim:#93A1B3; --faint:#6B7B8E;
    --blue:#5C9DFF; --bluewash:#16233A;
    --ok:#4ECB9B; --okwash:#10261F;
    --warn:#E8B45C; --warnwash:#2A2010;
    --bad:#FF8478; --badwash:#2B1513;
    --grey:#93A1B3; --greywash:#1B2531;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--ui);
  font-size:15px; line-height:1.47; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv05" 1;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* keyboard help */
.keys{position:fixed;inset:0;display:grid;place-items:center;z-index:60;
  background:rgba(10,20,32,.45);backdrop-filter:blur(3px)}
.keys[hidden]{display:none}
.keys div{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 24px;box-shadow:var(--shadow);min-width:300px}
.keys h3{margin:0 0 12px;font-size:16px;font-weight:640}
.keys dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:13.5px}
.keys dt{text-align:right}
.keys kbd{font:inherit;font-size:11.5px;font-weight:600;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:2px 6px;background:var(--wash)}
.keys dd{margin:0;color:var(--dim)}
/* offline / feed trouble banner */
.banner{border-radius:var(--r2);padding:10px 14px;margin-bottom:14px;font-size:13.5px;
  background:var(--warnwash);color:var(--warn);display:flex;gap:9px;align-items:center}
.banner.bad{background:var(--badwash);color:var(--bad)}

/* --- shell --------------------------------------------------------------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
nav{
  border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;
  height:100vh;display:flex;flex-direction:column;gap:3px;background:var(--bg);
}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo b{font-size:19px;font-weight:660;letter-spacing:-.022em}
.logo i{
  font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--blue);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;
}
.nav{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r2);
  color:var(--dim);font-weight:520;font-size:14.5px;width:100%;text-align:left;
}
.nav:hover{background:var(--wash);color:var(--text)}
.nav[aria-current=page]{background:var(--bluewash);color:var(--blue);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.nav .n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.navfoot{margin-top:auto;padding:10px 11px;border-top:1px solid var(--line)}
.navfoot div{font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}

main{min-width:0;padding:26px 30px 70px;max-width:1040px}
h1{font-size:27px;font-weight:660;letter-spacing:-.025em;margin:0 0 3px}
.sub{color:var(--dim);font-size:14px;margin:0 0 22px}
h2{font-size:13px;font-weight:620;color:var(--dim);margin:26px 0 9px}

/* --- status answer ------------------------------------------------------- */
.answer{
  border-radius:var(--r);padding:20px 22px;margin-bottom:8px;
  border:1px solid var(--line);background:var(--raise);box-shadow:var(--shadow);
}
.answer.ok{background:var(--okwash);border-color:transparent}
.answer.warn{background:var(--warnwash);border-color:transparent}
.answer.bad{background:var(--badwash);border-color:transparent}
.answer .big{font-size:23px;font-weight:650;letter-spacing:-.022em;margin:0}
.answer.ok .big{color:var(--ok)} .answer.warn .big{color:var(--warn)}
.answer.bad .big{color:var(--bad)}
.answer p{margin:5px 0 0;color:var(--dim);font-size:14px;max-width:62ch}
.answer .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* --- pieces -------------------------------------------------------------- */
.bullet{
  font-weight:700;font-size:12.5px;letter-spacing:.01em;padding:4px 9px;
  border-radius:7px;background:var(--text);color:var(--bg);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.bullet.bus{background:var(--blue);color:#fff}
.bullet.train{background:#0E7C5A;color:#fff}
.bullet.flight{background:#6B3FD4;color:#fff}
.bullet.event,.bullet.document{background:var(--greywash);color:var(--dim)}
.tag{
  font-size:11.5px;font-weight:640;padding:3px 8px;border-radius:99px;white-space:nowrap;
}
.t-SUPPRESS{background:var(--greywash);color:var(--grey)}
.t-LOG{background:var(--bluewash);color:var(--blue)}
.t-NOTIFY{background:var(--warnwash);color:var(--warn)}
.t-INTERVENE{background:var(--badwash);color:var(--bad)}
.btn{
  padding:8px 14px;border-radius:10px;font-weight:580;font-size:14px;
  background:var(--wash);border:1px solid var(--line);
}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--blue);color:#fff;border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--raise)}
.item{
  display:flex;align-items:center;gap:13px;padding:13px 15px;width:100%;
  text-align:left;border-bottom:1px solid var(--line2);
}
.item:last-child{border-bottom:0}
.item:hover{background:var(--wash)}
.item .body{min-width:0;flex:1}
.item .body b{display:block;font-weight:580;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .body small{color:var(--faint);font-size:12.5px;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item time{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.chev{color:var(--faint);flex:none}
.star{flex:none;padding:6px;border-radius:8px;color:var(--faint)}
.star[aria-pressed=true]{color:var(--warn)}
.star:hover{background:var(--line2)}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:30px 24px;
  text-align:center;color:var(--dim);font-size:14px;
}
.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:5px;font-weight:600}
.empty code{background:var(--wash);padding:2px 7px;border-radius:6px;font-size:13px;
  font-family:ui-monospace,Menlo,Consolas,monospace}

/* --- search -------------------------------------------------------------- */
.searchbar{
  display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--raise);box-shadow:var(--shadow);
}
.searchbar:focus-within{border-color:var(--blue)}
.searchbar input{border:0;outline:0;background:none;color:var(--text);flex:1;font-size:16px}
.searchbar input::placeholder{color:var(--faint)}
.kbd{
  font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--line);
  border-radius:6px;padding:2px 6px;
}
.chips{display:flex;gap:7px;margin:14px 0 4px;flex-wrap:wrap}
.chip{
  padding:6px 12px;border-radius:99px;font-size:13px;font-weight:540;
  border:1px solid var(--line);color:var(--dim);
}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:transparent}
.grp{font-size:12px;font-weight:620;color:var(--faint);padding:14px 2px 7px}
.hit[aria-selected=true]{background:var(--bluewash)}
mark.q{background:var(--warnwash);color:inherit;border-radius:3px;padding:0 1px}

/* --- sheet --------------------------------------------------------------- */
.scrim{
  position:fixed;inset:0;background:rgba(10,20,32,.34);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40;backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;top:0;right:0;height:100%;width:min(560px,100%);z-index:41;
  background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:var(--shadow);
}
.sheet.on{transform:none}
.sheet:focus{outline:none}
.sheethead{
  position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:16px 20px;display:flex;align-items:center;gap:12px;z-index:2;
}
.sheethead b{font-size:17px;font-weight:640;letter-spacing:-.02em}
.sheethead .x{margin-left:auto;padding:7px;border-radius:9px;color:var(--dim)}
.sheethead .x:hover{background:var(--wash)}
.sheetbody{padding:18px 20px 60px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px;margin:4px 0}
.kv dt{color:var(--faint)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.quote{border-left:2.5px solid var(--line);padding:2px 0 2px 13px;margin:14px 0;
  color:var(--text);font-size:14px}
.quote b{display:block;font-size:11.5px;color:var(--faint);font-weight:620;margin-bottom:2px}
.src{
  display:block;width:100%;text-align:left;border:1px solid var(--line);
  border-radius:var(--r2);padding:11px 13px;margin:8px 0;background:var(--raise);
}
.src:hover{border-color:var(--blue)}
.src .loc{font-size:11.5px;color:var(--blue);font-weight:580}
.src .snip{color:var(--dim);font-size:12.5px;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paper{
  background:#FBFAF7;color:#16202B;border:1px solid var(--line);border-radius:var(--r2);
  padding:15px 17px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  line-height:1.7;white-space:pre-wrap;max-height:330px;overflow:auto;margin-top:9px;
}
.paper mark{background:#FFE7A3;color:#16202B;font-weight:700;border-radius:3px;
  box-shadow:0 0 0 2px #E9A93A}
.stops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stop{font-size:12px;color:var(--dim);background:var(--wash);padding:4px 9px;border-radius:7px}

/* --- map ----------------------------------------------------------------- */
.mapwrap{
  border:1px solid var(--line);border-radius:var(--r);background:var(--wash);
  overflow:hidden;position:relative;
}
#leaf{height:min(620px,68vh);width:100%;background:var(--wash)}
.leaflet-container{font:inherit}
@media (prefers-color-scheme:dark){
  /* Tone the basemap down so vehicle dots stay the brightest thing on it. */
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(.9)}
}
.mapbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.mapbar .searchbar{flex:1;min-width:210px;padding:9px 13px;box-shadow:none}
.mapbar .searchbar input{font-size:14.5px}
.livedot{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:none}
.livedot.stale{background:var(--warn)}
.routescroll{max-height:250px;overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--r);background:var(--raise);margin-top:11px}
.rrow{display:flex;align-items:center;gap:11px;padding:9px 13px;width:100%;
  text-align:left;border-bottom:1px solid var(--line2)}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--wash)}
.rrow[aria-pressed=true]{background:var(--bluewash)}
.rswatch{width:11px;height:11px;border-radius:3px;flex:none}
.vpop b{display:block;font-size:14px;margin-bottom:3px}
.eta{font-variant-numeric:tabular-nums;font-weight:660;font-size:17px;
  letter-spacing:-.02em;min-width:74px;text-align:right}
.eta small{display:block;font-size:11px;font-weight:500;color:var(--faint);
  letter-spacing:0}
.eta.soon{color:var(--ok)} .eta.none{color:var(--faint);font-size:13px;font-weight:560}
.conf{height:3px;border-radius:99px;background:var(--line2);width:46px;overflow:hidden}
.conf div{height:100%;background:var(--blue)}
.vpop small{color:#5D6B7C}
.mapwrap svg{display:block;width:100%;height:auto}
.mline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.mstop{fill:var(--bg);stroke-width:2}
.mveh{stroke:var(--bg);stroke-width:2.5;cursor:pointer}
.mveh:hover{stroke-width:4}
.mhit{fill:transparent;cursor:pointer}
.mlabel{font:600 13px var(--ui);fill:var(--text);paint-order:stroke;
  stroke:var(--bg);stroke-width:4px}
.mpulse{fill:none;stroke-width:2.5;opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .mpulse{animation:pulse 1.9s ease-out infinite}
  @keyframes pulse{0%{r:7;opacity:.85}100%{r:19;opacity:0}}
}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:12.5px;
  color:var(--dim)}
.maplegend span{display:flex;align-items:center;gap:6px}
.maplegend i{width:14px;height:4px;border-radius:2px;display:inline-block}

/* --- upload -------------------------------------------------------------- */
.drop{
  border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 20px;
  text-align:center;color:var(--dim);font-size:14px;background:var(--raise);
}
.drop.over{border-color:var(--blue);background:var(--bluewash);color:var(--blue)}
.drop b{display:block;color:var(--text);font-weight:600;margin-bottom:3px;font-size:15px}

/* --- audit --------------------------------------------------------------- */
details.audit{border:1px solid var(--line);border-radius:var(--r2);margin-top:12px;
  background:var(--raise)}
details.audit summary{padding:11px 13px;cursor:pointer;font-size:13.5px;font-weight:560}
details.audit pre{margin:0;padding:0 13px 13px;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;color:var(--dim);white-space:pre-wrap;max-height:260px;overflow:auto}
.whynot{background:var(--wash);border-radius:var(--r2);padding:12px 14px;margin-top:12px;
  font-size:13.5px;color:var(--dim)}
.whynot b{display:block;color:var(--text);font-size:12px;font-weight:620;margin-bottom:3px}

/* --- evidence table ------------------------------------------------------ */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left}
th{color:var(--faint);font-weight:560;font-size:11.5px}
tr.best td{color:var(--ok);font-weight:600}
td.na{color:var(--faint);text-align:left}

/* --- progress ------------------------------------------------------------ */
.prog{height:3px;background:var(--line2);border-radius:99px;overflow:hidden;margin:16px 0 0}
.prog div{height:100%;background:var(--blue);width:0;transition:width .3s}

/* --- mobile -------------------------------------------------------------- */
@media (max-width:860px){
  :root{--rail:0px}
  .app{grid-template-columns:1fr}
  nav{
    position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;
    border-right:0;border-top:1px solid var(--line);padding:6px 6px 22px;z-index:30;
  }
  .logo,.navfoot{display:none}
  .nav{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;justify-content:center}
  .nav .n{display:none}
  main{padding:20px 16px 110px}
  h1{font-size:23px}
  .sheet{width:100%;border-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Sections">
    <div class="logo"><i>D</i><b>Dispatch</b></div>
    <button class="nav" data-v="now" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><path d="M3 12h4l2-7 3 14 2.5-9 1.5 4H21"/></svg>
      Now<span class="n" id="n-now"></span></button>
    <button class="nav" data-v="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      Search<span class="n">⌘K</span></button>
    <button class="nav" data-v="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2z"/>
        <path d="M9 3v16M15 5v16"/></svg>
      Map<span class="n" id="n-map"></span></button>
    <button class="nav" data-v="stops">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><circle cx="12" cy="10" r="3"/>
        <path d="M12 21s6.5-6.1 6.5-11a6.5 6.5 0 1 0-13 0C5.5 14.9 12 21 12 21z"/></svg>
      Stops<span class="n" id="n-stops"></span></button>
    <button class="nav" data-v="trips">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><rect x="4" y="3" width="16" height="15" rx="3"/>
        <path d="M8 21h8M9 8h6M9 12h4"/></svg>
      Trips<span class="n" id="n-trips"></span></button>
    <button class="nav" data-v="evidence">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Evidence</button>
    <div class="navfoot">
      <div><span>backend</span><span id="f-backend">—</span></div>
      <div><span>feed clock</span><span id="f-clock" class="num">—</span></div>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div class="sr" id="announce" aria-live="polite" role="status"></div>
<div class="keys" id="keys" hidden>
  <div role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
    <h3>Keyboard</h3>
    <dl>
      <dt><kbd>⌘K</kbd></dt><dd>Search anything</dd>
      <dt><kbd>1</kbd>–<kbd>6</kbd></dt><dd>Jump to a section</dd>
      <dt><kbd>↑</kbd><kbd>↓</kbd></dt><dd>Move through results</dd>
      <dt><kbd>↵</kbd></dt><dd>Open the selected result</dd>
      <dt><kbd>esc</kbd></dt><dd>Close, or clear the search</dd>
      <dt><kbd>?</kbd></dt><dd>This list</dd>
    </dl>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="sheettitle">
  <div class="sheethead"><b id="sheettitle">Details</b>
    <button class="x" id="sheetx" aria-label="Close">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button></div>
  <div class="sheetbody" id="sheetbody"></div>
</aside>

<script>
/* --------------------------------------------------------------------------
   One rule about data in this UI: nothing is asserted without a source. Every
   search result and every leg says whether Dispatch knows it from the live
   feed or from a document the user gave it, and every claim in a detail sheet
   can be opened to the exact characters it came from.
   ----------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = t => t ? new Date(t*1000).toLocaleTimeString([],
  {hour:"numeric",minute:"2-digit"}) : "";
const mins = s => s==null ? null : Math.round(s/60);
/* Extraction labels arrive machine-shaped ("transit 61C", "rail 43") because
   that is what the schema calls them. Riders read route numbers, so relabel
   for display only -- the stored value is untouched. */
const PRETTY = {transit:"Route", rail:"Train", flight:"Flight", bus:"Route"};
function nice(label){
  const m = /^(transit|rail|flight|bus)\s+(.+)$/i.exec(String(label||""));
  return m ? `${PRETTY[m[1].toLowerCase()]} ${m[2]}` : (label||"");
}

let ST=null, CAT=null, VIEW="now", Q="", MODE="all", SEL=0, POLL=null, DOCS={};
/* Upload result lives in state, not in the DOM. The view re-renders on every
   poll, so anything written straight into the page gets wiped a moment later. */
let UPLOAD=null, LASTSIG="", LASTTITLE="", MARKERS=new Map();

/* Only re-render when something the current view actually depends on has
   changed.
   The poller used to redraw everything twice a second, which made text flicker,
   stole focus from whatever you were typing in, and -- once the map arrived --
   rebuilt several hundred Leaflet markers on every tick. Diffing on a cheap
   signature turns all of that into a no-op when nothing moved. */
function signature(){
  const st=ST||{}, mp=MAPDATA||{}, ct=CAT||{}, pr=st.progress||{};
  return [
    VIEW, Q, MODE, MQ, MONLYBAD, [...MSEL].sort().join(","),
    [...FOLLOW].sort().join(","), st.status, pr.done, st.backend, st.clock,
    (st.findings||[]).length, (st.drafts||[]).length, (st.itinerary||[]).length,
    (ct.legs||[]).length, (mp.vehicles||[]).length, (mp.routes||[]).length,
    (mp.alerts||[]).length, mp.updated_at, mp.error,
    UPLOAD ? (UPLOAD.busy||UPLOAD.error||UPLOAD.document?.source_id||"u") : "",
    STOPQ, ARRSTOP, (STOPS||[]).length,
    ARRIVALS ? ARRIVALS.map(a=>a.eta_s).join(",") : "pending",
  ].join("\u0001");
}

/* --- the answer at the top ------------------------------------------------ */
function answer(){
  const fs = (ST?.findings)||[];
  const acted = fs.filter(f => f.verdict.act==="INTERVENE");
  const notified = fs.filter(f => f.verdict.act==="NOTIFY");
  const leads = fs.filter(f => ["NOTIFY","INTERVENE"].includes(f.verdict.act)
    && f.lead_time_s!=null).map(f=>f.lead_time_s).sort((a,b)=>a-b);
  const med = leads.length ? (leads[Math.floor(leads.length/2)]/60).toFixed(1) : null;

  if(!fs.length){
    return `<div class="answer"><p class="big">Watching your trips</p>
      <p>Nothing has crossed a threshold. Dispatch is reading vehicle telemetry
      and comparing it against the legs it found in your documents.</p>
      <div class="row"><button class="btn pri" data-run>Replay a recording</button></div></div>`;
  }
  if(acted.length){
    const f = acted[0], leg = f.item;
    return `<div class="answer bad"><p class="big">You're going to miss ${
      esc(leg? nice(leg.label) : f.signal.route_id)}</p>
      <p>A ${esc(f.signal.kind.toLowerCase())} on ${esc(f.signal.route_id)}${
        leg&&leg.depart_at? ", which you needed at "+hhmm(leg.depart_at):""}, and
      the slack is gone.${acted.length>1? ` ${acted.length} of your legs are
      affected.`:""} A message is drafted, waiting for you to send it.${
        med? ` Spotted ${med} min before the agency published anything.`:""}</p>
      <div class="row"><button class="btn pri" data-open="event:${
        esc(f.signal.signal_id)}">See why</button>
        <button class="btn" data-v="trips">Review drafts</button></div></div>`;
  }
  if(notified.length){
    const f = notified[0];
    return `<div class="answer warn"><p class="big">Tight, but you can still make it</p>
      <p>${esc(f.signal.kind.toLowerCase())} on ${esc(f.signal.route_id)}${
        f.item? " affects "+esc(nice(f.item.label)):""}. You have slack for now.${
        med? ` Detected ${med} min ahead of the agency.`:""}</p>
      <div class="row"><button class="btn pri" data-open="event:${
        esc(f.signal.signal_id)}">See why</button></div></div>`;
  }
  return `<div class="answer ok"><p class="big">You're clear</p>
    <p>${fs.length} anomalies measured on the network, none of them on a leg you
    are travelling. Dispatch kept quiet about all of them.${
      med? ` Median lead when it does speak: ${med} min.`:""}</p>
    <div class="row"><button class="btn" data-v="evidence">How it decides</button></div></div>`;
}

  }

  h += `<h2>Activity</h2>`;
  h += fs.length ? `<div class="list">` + fs.map(f=>{
    const lead = mins(f.lead_time_s);
    const surfaced = ["NOTIFY","INTERVENE"].includes(f.verdict.act);
    return `<button class="item" data-open="event:${esc(f.signal.signal_id)}">

function score(text, q){
  const t = text.toLowerCase(), i = t.indexOf(q);
  if(i === 0) return 3; if(i > 0) return 2;
  return q.split("").every(c => t.includes(c)) ? 1 : 0;
}
function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark class='q'>" + esc(text.slice(i,i+q.length))
    + "</mark>" + esc(text.slice(i+q.length));
}
function results(){
  if(!CAT) return [];
  const q = Q.trim().toLowerCase();
  const pool = [...CAT.routes, ...CAT.legs, ...CAT.vehicles, ...CAT.documents,
                ...CAT.events];
  return pool
    .filter(x => MODE==="all" || x.mode===MODE)
    .map(x => ({x, s: q ? Math.max(score(nice(x.title),q), score(x.subtitle||"",q)*0.9,
                 score(x.route||"",q)) : 1}))
    .filter(r => r.s > 0)
    .sort((a,b) => b.s-a.s || a.x.title.localeCompare(b.x.title))
    .slice(0, 60).map(r => r.x);
}

const RCOLOR = ["#0B5CD5","#0E7C5A","#B4231C","#6B3FD4","#8A5200","#0F7B8A"];
/* Colour by position in a stable sorted list, not by hashing the route id.
   Hashing looked elegant and put three of four Pittsburgh routes on the same
   red, which made the map unreadable. Distinctness matters more than
   cleverness when the colour is the only thing telling two lines apart. */
let _rkeys = [];
function colorFor(id){
  if(!_rkeys.length && CAT?.routes) _rkeys = CAT.routes.map(r=>r.id).sort();
  const i = _rkeys.indexOf(String(id));
  return RCOLOR[(i < 0 ? 0 : i) % RCOLOR.length];
}

/* A map drawn from coordinates rather than tiles.
   No API key, no tile server, no attribution burden, and it still renders when
   the venue wifi has gone. The projection is a plain equirectangular fit to the
   bounding box of the routes, with the x axis scaled by cos(latitude) so shapes
   are not stretched -- at city scale that is indistinguishable from Mercator. */
let MAPDATA=null, MAP=null, MLAYER=null, MLINES=null, MQ="", MSEL=new Set(),
    MONLYBAD=false, LEAFLET=null;

/* Leaflet from a CDN, with the coordinate map as a fallback.
   A real basemap needs tiles, and tiles need a network. Rather than make the
   whole map depend on the venue wifi, try to load Leaflet and fall back to
   drawing from coordinates if it does not arrive. Both paths render the same
   data; only the background differs. */
function loadLeaflet(){
  if(LEAFLET) return LEAFLET;
  LEAFLET = new Promise(resolve => {
    if(window.L) return resolve(window.L);
    const css=document.createElement("link");
    css.rel="stylesheet";
    css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js=document.createElement("script");
    js.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload=()=>resolve(window.L||null);
    js.onerror=()=>resolve(null);
    document.head.appendChild(js);
    setTimeout(()=>resolve(window.L||null), 6000);
  });
  return LEAFLET;
}

const modeColor = {bus:"#0B5CD5","light rail":"#0E7C5A",rail:"#0E7C5A",
                   incline:"#8A5200",subway:"#6B3FD4"};
function routeColor(r){
  if(r && r.color) return r.color;
  return modeColor[r && r.mode] || "#0B5CD5";
}

function visibleRoutes(){
  const rs = MAPDATA?.routes||[];
  const q = MQ.trim().toLowerCase();
  return rs.filter(r =>
    (!MONLYBAD || r.disrupted) &&
    (!q || r.label.toLowerCase().includes(q) ||
      (r.name||"").toLowerCase().includes(q) || r.id.toLowerCase().includes(q)));
}

/* Draw onto the real map if Leaflet made it, otherwise the coordinate map. */
async function paintMap(){
  const host = $("#leaf"); if(!host || !MAPDATA) return;
  const rs = visibleRoutes(), ids = new Set(rs.map(r=>r.id));
  const vehs = (MAPDATA.vehicles||[]).filter(v=>ids.has(v.route));
  const L = await loadLeaflet();

  if(!L){ host.outerHTML = svgMap(rs, vehs); return; }
  if(!MAP || !document.body.contains(MAP.getContainer())){
    MAP = L.map(host, {preferCanvas:true, zoomControl:true,
                       attributionControl:true}).setView([40.4406,-79.9959], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:18, attribution:"&copy; OpenStreetMap contributors"}).addTo(MAP);
    MLAYER = L.layerGroup().addTo(MAP);
    MLINES = L.layerGroup().addTo(MAP);
  }
  MLINES.clearLayers();

  // Lines only for selected routes, or for a narrow filter. Drawing a hundred
  // overlapping shapes at once is unreadable.
  const drawLines = rs.filter(r =>
    (MSEL.size ? MSEL.has(r.id) : rs.length <= 6) && r.shape && r.shape.length>1);
  for(const r of drawLines)
    L.polyline(r.shape, {color:routeColor(r), weight:4, opacity:.8}).addTo(MLINES);

  // Move the markers that already exist rather than rebuilding them all.
  // With ~700 live vehicles, clearing and re-adding the layer every poll
  // drops frames and closes any popup the user had open mid-read.
  const byId = Object.fromEntries((MAPDATA.routes||[]).map(r=>[r.id,r]));
  const alive = new Set();
  for(const v of vehs){
    const r = byId[v.route]||{};
    alive.add(v.id);
    const popup = `<div class="vpop"><b>${esc(r.label||v.route)} · ${esc(v.id)}</b>
      <small>${esc(r.name||"")}</small>
      <small>${esc(v.status||"in service")}${v.stop?" · "+esc(v.stop):""}</small>
      </div>`;
    const existing = MARKERS.get(v.id);
    if(existing){
      existing.setLatLng([v.lat,v.lon]);
      existing.setStyle({fillColor:routeColor(r),
        radius: MSEL.size && MSEL.has(v.route) ? 7 : 5});
      existing.setPopupContent(popup);
      continue;
    }
    const mk = L.circleMarker([v.lat,v.lon], {
      radius: MSEL.size && MSEL.has(v.route) ? 7 : 5,
      color:"#fff", weight:1.5, fillColor:routeColor(r), fillOpacity:.95,
    }).bindPopup(popup);
    mk.addTo(MLAYER); MARKERS.set(v.id, mk);
  }
  for(const [id, mk] of [...MARKERS]){
    if(!alive.has(id)){ MLAYER.removeLayer(mk); MARKERS.delete(id); }
  }

  const pts = vehs.map(v=>[v.lat,v.lon])
    .concat(drawLines.flatMap(r=>r.shape));
  if(pts.length && (MSEL.size || MQ.trim()))
    MAP.fitBounds(L.latLngBounds(pts).pad(0.12), {animate:false});
}

/* The offline path: same data, drawn from coordinates. */
function svgMap(rs, vehs){
  const pts = rs.flatMap(r=>r.shape&&r.shape.length?r.shape:[])
    .concat(vehs.map(v=>[v.lat,v.lon]));
  if(pts.length < 2) return `<div class="empty" style="border:0">
    No geometry to draw.</div>`;
  const lats=pts.map(p=>p[0]), lons=pts.map(p=>p[1]);
  let la0=Math.min(...lats), la1=Math.max(...lats);
  let lo0=Math.min(...lons), lo1=Math.max(...lons);
  const pa=(la1-la0)*.1||.01, po=(lo1-lo0)*.1||.01;
  la0-=pa; la1+=pa; lo0-=po; lo1+=po;
  const W=1000, k=Math.cos((la0+la1)/2*Math.PI/180);
  const H=Math.max(340, Math.min(700, W*(la1-la0)/((lo1-lo0)*k)));
  const X=l=>((l-lo0)/(lo1-lo0)*W).toFixed(1), Y=l=>((la1-l)/(la1-la0)*H).toFixed(1);
  let g="";
  for(const r of rs){
    if(!r.shape||r.shape.length<2) continue;
    g += `<path class="mline" stroke="${routeColor(r)}" d="${
      r.shape.map((p,i)=>`${i?"L":"M"}${X(p[1])} ${Y(p[0])}`).join("")}"/>`;
  }
  const byId=Object.fromEntries(rs.map(r=>[r.id,r]));
  for(const v of vehs)
    g += `<circle class="mveh" cx="${X(v.lon)}" cy="${Y(v.lat)}" r="5.5"
      fill="${routeColor(byId[v.route]||{})}"><title>${esc(v.route)} ${
      esc(v.id)}</title></circle>`;
  return `<svg viewBox="0 0 ${W} ${H.toFixed(0)}" role="img"
    aria-label="Map of routes and vehicle positions">${g}</svg>
    <div style="padding:9px 13px;font-size:12px;color:var(--dim);
      border-top:1px solid var(--line)">Basemap unavailable, so this is drawn
      from coordinates. Positions are unaffected.</div>`;
}

/* The board every transit app has, with one difference: when Dispatch cannot
   predict, it says which of its own conditions stopped it rather than showing
   a confident wrong number. */
function etaCell(a){
  if(a.eta_s == null){
    const why = {stalled:"not moving", insufficient_data:"just appeared",
                 off_route:"off route",
                 beyond_horizon:"over 20 min"}[a.basis] || a.basis;
    return `<span class="eta none">${esc(why)}</span>`;
  }
  const m = Math.round(a.eta_s/60);
  return `<span class="eta ${m<=3?"soon":""}">${m<1?"due":m+" min"}
    <small>${(a.distance_m/1000).toFixed(1)} km</small></span>`;
}

function viewStops(){

  if(!STOPS.length) return h + `<div class="empty"><b>No stop geometry</b>
    Run <code>python3 -m dispatch.cli gtfs</code> for the real PRT network, or
    <code>python3 -m dispatch.cli fixtures</code> for the demo world.</div>`;

  if(ARRSTOP){
    const rows = ARRIVALS;
    h += `<button class="btn" data-stopback>Back to all stops</button>
      <h2 style="margin-top:18px">${esc(ARRSTOP)}</h2>`;
    h += rows === null ? `<div class="empty">working out arrivals…</div>`
      : rows.length ? `<div class="list">` + rows.map(a=>`
        <div class="item">
          <span class="bullet bus">${esc(a.route)}</span>

              : a.basis==="beyond_horizon" ? "too far out to predict"

          <span class="conf" title="confidence ${a.confidence}">

        <p class="sub" style="margin-top:10px">The bar is confidence, which

  const q = STOPQ.trim().toLowerCase();

  h += `<div class="list" style="margin-top:12px">` + list.slice(0,120).map(s=>`
    <button class="item" data-stop="${esc(s.stop_id)}">

async function viewEvidence(){
  let arms = [];
  try{ arms = (await (await fetch("/api/eval")).json()).arms||[]; }catch(e){}
  const best = Math.max(0, ...arms.map(a=>a.f1||0));
  let h = `<h1>Evidence</h1><p class="sub">The same recording and the same
    itinerary through three different triage decisions. The only variable is
    who decides.</p>`;
  h += arms.length ? `<div class="list" style="padding:6px 14px 10px"><table>
    <tr><th>arm</th><th>caught</th><th>false alarms</th><th>missed</th>
        <th>precision</th><th>recall</th><th>F1</th><th>alerts/hr</th></tr>` +
    arms.map(a=>{
      if((a.note||"").startsWith("did not run"))
        return `<tr><td>${esc(a.arm)}</td><td colspan="7" class="na">${esc(a.note)}</td></tr>`;
      return `<tr class="${a.f1===best?"best":""}"><td>${esc(a.arm)}</td>
        <td>${a.tp}</td><td>${a.fp+(a.spurious||0)}</td><td>${a.fn}</td>
        <td>${a.precision.toFixed(2)}</td><td>${a.recall.toFixed(2)}</td>
        <td>${a.f1.toFixed(2)}</td><td>${a.alerts_per_hour.toFixed(2)}</td></tr>`;
    }).join("") + `</table></div>`
   : `<div class="empty"><b>Not scored yet</b>Run
      <code>python3 -m dispatch.cli eval</code></div>`;

  h += `<h2>What the decisions mean</h2><div class="list">` +
  [["SUPPRESS","Normal operations misread as a fault. A bus sitting at its terminal is doing its job."],
   ["LOG","A real disruption, but not on a leg you are travelling. Recorded, and you are not told."],
   ["NOTIFY","Affects one of your legs, and you still have slack to absorb it."],
   ["INTERVENE","Affects a leg and the slack is gone. Drafts a message, and waits for you."]]
  .map(([k,v])=>`<div class="item"><span class="tag t-${k}">${k.toLowerCase()}</span>
    <span class="body"><small style="color:var(--dim);white-space:normal">${v}</small></span>
  </div>`).join("") + `</div>`;
  return h;
}

/* --- sheets --------------------------------------------------------------- */
function openSheet(title, html){
  $("#sheettitle").innerHTML = title;
  $("#sheetbody").innerHTML = html;
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
  // Lock the page behind the sheet. Without this the list underneath keeps
  // scrolling under your finger, which feels broken on a phone, and the
  // sheet is position:fixed so anything trying to scroll a child into view
  // ends up fighting the page scroll instead.
  document.body.style.overflow = "hidden";
  // Focus the panel itself, on the next tick.
  //
  // Both halves matter. Focusing the close button meant that opening a result
  // with Enter moved focus onto a button *during* that same keydown, and the
  // browser then activated the newly focused button with the same keypress --
  // the sheet flashed open and shut. Deferring past the current key sequence
  // fixes that, and focusing the dialog rather than a control inside it is
  // also what a screen reader wants on open.
  setTimeout(() => $("#sheet").focus({preventScroll:true}), 0);
}
/* Deep links, so an event or a trip can be pasted into a message and open
   straight to it. */
function setHash(token){
  if(location.hash.slice(1) !== token)
    history.replaceState(null, "", token ? "#"+token : location.pathname);
}
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
  document.body.style.overflow = "";
  setHash("");
}
function find(kind,id){
  if(!CAT) return null;
  const pool = {route:CAT.routes,leg:CAT.legs,vehicle:CAT.vehicles,
                document:CAT.documents,event:CAT.events}[kind]||[];
  return pool.find(x=>String(x.id)===String(id));
}
function open(token){
  setHash(token);
  const [kind, ...rest] = token.split(":"); const id = rest.join(":");
  if(kind === "event") return openEvent(id);
  if(kind === "route") return openRoute(id);
  if(kind === "leg")   return openLeg(id);
  if(kind === "vehicle") return openVehicle(id);
  if(kind === "document") return openDoc(id);
}
function openEvent(sigId){
  const f = (ST?.findings||[]).find(x=>x.signal.signal_id===sigId);
  if(!f) return;
  const v=f.verdict, ev=f.signal.evidence||{}, lead=mins(f.lead_time_s);
  let h = `<span class="tag t-${v.act}">${v.act.toLowerCase()}</span>
    <div class="quote"><b>${esc(v.reason_code)} · decided by ${esc(v.backend)}</b>
      ${esc(v.rationale||"no rationale returned")}</div><dl class="kv">
      <dt>route</dt><dd>${esc(f.signal.route_id)}</dd>
      <dt>vehicle</dt><dd>${esc(f.signal.vehicle_id)}</dd>
      <dt>noticed</dt><dd>${hhmm(f.signal.detected_at)}</dd>
      <dt>began</dt><dd>${hhmm(f.signal.first_seen_at)}</dd>
      <dt>confidence</dt><dd>${(v.confidence??0).toFixed(2)}</dd>`;
  for(const [k,val] of Object.entries(ev)) h += `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`;
  h += lead!=null && ["NOTIFY","INTERVENE"].includes(v.act)
    ? `<dt>vs agency</dt><dd style="color:var(--ok)">${lead} min earlier</dd>`
    : `<dt>vs agency</dt><dd class="na">nothing published</dd>`;
  h += `</dl>`;
  if(f.item) h += `<div class="quote"><b>threatens</b>${esc(nice(f.item.label))}${
    f.item.depart_at? " departing "+hhmm(f.item.depart_at):""}</div>`;
  const prov = (f.signal.provenance||[]).concat(
    f.item? Object.values(f.item.field_provenance||{}) : []);
  if(prov.length){
    h += `<h2>Where this came from</h2>`;
    prov.forEach((p,i)=>{ h += `<button class="src" data-prov="${i}">
      <span class="loc">${esc(p.source_type)} · ${esc(p.locator)}</span>
      <div class="snip">${esc(p.snippet||"")}</div></button>`; });
    h += `<div id="paper"></div>`;
  }
  h += whyNot(f);
  // When a vehicle is out of action, the number a rider actually wants is the
  // next one behind it. Detection knows which bus died and where; prediction
  // knows what is following. Neither is useful alone.
  if(["NOTIFY","INTERVENE"].includes(v.act) && ev.stop_id)
    h += `<div id="relief" class="whynot"><b>Next vehicle on this route</b>
      working it out…</div>`;
  if(v.request_json || v.response_raw){
    h += `<details class="audit"><summary>Audit trail: what the triage stage
      saw and said</summary>
      <pre>REQUEST\n${esc(v.request_json||"(none)")}\n\nRESPONSE\n${
        esc(v.response_raw||"(none)")}</pre></details>`;
  }
  openSheet(`${esc(f.signal.kind)} on ${esc(f.signal.route_id)}`, h);
  window.__prov = prov;
  if(["NOTIFY","INTERVENE"].includes(v.act) && ev.stop_id)
    loadRelief(ev.stop_id, f.signal.vehicle_id);
}
/* For anything Dispatch chose not to tell you about, say what would have had
   to be different. Suppression is the hard half of this product, so it should
   be legible rather than silent. */
function whyNot(f){
  const v=f.verdict, ev=f.signal.evidence||{};
  if(["NOTIFY","INTERVENE"].includes(v.act)) return "";
  const map = {
    NOT_ON_ITINERARY: `You have no leg on ${esc(f.signal.route_id)}. This would
      have reached you if one of your trips used this route.`,
    TERMINAL_LAYOVER: `The vehicle is sitting at a terminal stop, which is where
      layovers happen. This would have surfaced had it stopped mid-route.`,
    AMPLE_SLACK: `Your leg still has more than 45 minutes of slack. It escalates
      to notify under 45, and to intervene under 15.`,
    ALTERNATIVE_EXISTS: `This leg is marked as a backup or return, so it is
      capped at notify no matter how bad the disruption gets.`,
    TIMEPOINT_HOLD: `Stopped at a mid-route stop with no drift, which is a
      scheduled hold rather than a fault.`,
  };
  const why = map[v.reason_code] ||
    `The triage stage returned ${v.act.toLowerCase()} with reason
     ${esc(v.reason_code)}.`;
  return `<div class="whynot"><b>Why you weren't told</b>${why}</div>`;
}

function openRoute(id){
  const r = find("route",id); if(!r) return;
  const evs = (ST?.findings||[]).filter(f=>f.signal.route_id===id);
  const veh = (CAT?.vehicles||[]).filter(v=>v.route===id);
  const on = FOLLOW.has("route:"+id);
  let h = `<button class="btn ${on?"":"pri"}" data-follow="route:${esc(id)}">
      ${on?"Following":"Follow this route"}</button>
    <dl class="kv" style="margin-top:16px">
      <dt>service</dt><dd>every ${r.headway_min} min</dd>
      <dt>vehicles live</dt><dd>${r.vehicles}</dd>
      <dt>open events</dt><dd>${evs.length}</dd>
      <dt>source</dt><dd>${esc(r.source)}</dd></dl>
    <h2>Stops</h2><div class="stops">${
      r.stops.map(s=>`<span class="stop">${esc(s)}</span>`).join("")}</div>`;
  if(evs.length){ h += `<h2>Events on this route</h2><div class="list">` +
    evs.map(f=>`<button class="item" data-open="event:${esc(f.signal.signal_id)}">
      <span class="body"><b>${esc(f.signal.kind)}</b>
        <small>${esc(f.verdict.reason_code)}</small></span>
      <time>${hhmm(f.signal.detected_at)}</time>
      <span class="tag t-${f.verdict.act}">${f.verdict.act.toLowerCase()}</span>
      ${chev}</button>`).join("") + `</div>`; }
  if(veh.length){ h += `<h2>Vehicles</h2><div class="list">` +
    veh.slice(0,8).map(v=>`<button class="item" data-open="vehicle:${esc(v.id)}">
      <span class="body"><b>${esc(v.id)}</b><small>${esc(v.subtitle)}</small></span>
      ${chev}</button>`).join("") + `</div>`; }
  openSheet(`<span class="bullet bus">${esc(id)}</span>`, h);
}
function openVehicle(id){
  const v = find("vehicle",id); if(!v) return;
  openSheet(esc(id), `<dl class="kv">
    <dt>route</dt><dd>${esc(v.route)}</dd>
    <dt>status</dt><dd>${esc(v.subtitle)}</dd>
    <dt>position</dt><dd>${v.lat?.toFixed(5)}, ${v.lon?.toFixed(5)}</dd>
    <dt>near stop</dt><dd>${esc(v.stop||"between stops")}</dd>
    <dt>last seen</dt><dd>${hhmm(v.seen)}</dd>
    <dt>source</dt><dd>${esc(v.source)}</dd></dl>
    <div class="quote"><b>note</b>Positions come straight from the agency's
    GTFS-Realtime feed. Dispatch does not smooth or interpolate them.</div>`);
}
function openLeg(id){
  const leg = find("leg",id); if(!leg) return;
  const full = (ST?.itinerary||[]).find(i=>i.item_id===id);
  let h = `<dl class="kv">
    <dt>service</dt><dd>${esc(leg.route||"—")}</dd>
    <dt>departs</dt><dd>${leg.depart_at? hhmm(leg.depart_at):"no time read"}</dd>
    ${leg.headway_min?`<dt>frequency</dt><dd>every ${leg.headway_min} min</dd>`:""}
    <dt>read from</dt><dd>${esc(leg.document||"your documents")}</dd></dl>`;
  const fp = full ? (full.field_provenance||{}) : {};
  const prov = Object.entries(fp).filter(([,p])=>p);
  if(prov.length){
    h += `<h2>Every field, and where it came from</h2>`;
    prov.forEach(([k,p],i)=>{ h += `<button class="src" data-prov="${i}">
      <span class="loc">${esc(k)} · ${esc(p.source_id)} · ${esc(p.locator)}</span>
      <div class="snip">${esc(p.snippet||"")}</div></button>`; });
    h += `<div id="paper"></div>`;
    window.__prov = prov.map(([,p])=>p);
  }
  openSheet(esc(nice(leg.title)), h);
}
function openDoc(id){
  openSheet(esc(id), `<div id="paper"></div>`);
  window.__prov = [{source_id:id, char_start:null, char_end:null}];
  showPaper(0);
}
async function loadRelief(stop, excludeVehicle){
  const box = $("#relief"); if(!box) return;
  let rows = [];
  try{
    rows = (await (await fetch(`/api/arrivals?stop=${encodeURIComponent(stop)}`
      + `&exclude=${encodeURIComponent(excludeVehicle)}`)).json()).arrivals||[];
  }catch(e){}
  const usable = rows.filter(r => r.eta_s != null);
  if(!usable.length){
    box.innerHTML = `<b>Next vehicle on this route</b>Nothing else is inbound to
      ${esc(stop)} that we can predict, so there is no relief behind this one.`;
    return;
  }
  box.innerHTML = `<b>Next vehicle on this route</b>` + usable.slice(0,3).map(r=>{
    const m = Math.round(r.eta_s/60);
    return `<div style="display:flex;gap:10px;align-items:baseline;margin-top:5px">
      <span class="bullet bus">${esc(r.route)}</span>
      <span style="color:var(--text)">${esc(r.vehicle)}</span>
      <span style="margin-left:auto;font-weight:660" class="num">${
        m<1?"due":m+" min"}</span></div>`;
  }).join("") + `<div style="margin-top:7px;font-size:12.5px">Predicted at ${
    esc(stop)}, excluding the vehicle above.</div>`;
}

async function showPaper(i){
  const p = (window.__prov||[])[i]; if(!p) return;
  const box = $("#paper"); if(!box) return;
  box.innerHTML = `<div class="empty" style="padding:18px">opening ${
    esc(p.source_id)}…</div>`;
  if(!p.source_id || p.source_type === "prt-bus" || p.source_type === "prt-rail"){
    box.innerHTML = `<div class="quote"><b>telemetry</b>${
      esc(p.snippet||"no excerpt")}</div>`;
    return;
  }
  try{
    if(!DOCS[p.source_id])
      DOCS[p.source_id] = await (await fetch(
        "/api/document/"+encodeURIComponent(p.source_id))).json();
    const d = DOCS[p.source_id], t = d.text||"";
    let inner;
    if(p.char_start==null){ inner = esc(t); }
    else{
      const a=Math.max(0,p.char_start), b=Math.min(t.length,p.char_end);
      inner = esc(t.slice(0,a))+"<mark>"+esc(t.slice(a,b))+"</mark>"+esc(t.slice(b));
    }
    box.innerHTML = `<div style="margin:12px 0 0;color:var(--faint);font-size:12px">
      ${esc(d.source_id)}${p.char_start!=null?` · characters ${p.char_start}–${p.char_end}`:""}
      </div><div class="paper">${inner}</div>`;
    const paper = box.querySelector(".paper"), mk = box.querySelector("mark");
    if(paper&&mk) paper.scrollTop = Math.max(0, mk.offsetTop - paper.clientHeight/2);
  }catch(e){ box.innerHTML = `<div class="empty">Could not open that source.</div>`; }
}

/* --- render + events ------------------------------------------------------ */
async function render(force){
  const sig = signature();
  if(!force && sig === LASTSIG) return;
  LASTSIG = sig;
  const m = $("#main");
  m.innerHTML = VIEW==="now" ? viewNow()
    : VIEW==="search" ? viewSearch()
    : VIEW==="map" ? viewMap()
    : VIEW==="stops" ? viewStops()
    : VIEW==="trips" ? viewTrips()
    : `<div class="empty">loading…</div>`;
  if(VIEW==="evidence") m.innerHTML = await viewEvidence();
  $$(".nav").forEach(b => b.setAttribute("aria-current",
    b.dataset.v===VIEW ? "page" : "false"));
  $("#n-now").textContent = (ST?.findings||[]).length || "";
  $("#n-trips").textContent = (CAT?.legs||[]).length || "";
  $("#n-map").textContent = (MAPDATA?.vehicles||CAT?.vehicles||[]).length || "";
  $("#n-stops").textContent = (STOPS||[]).length || "";
  if(VIEW==="stops"){
    if(!STOPS) loadStops().then(()=>render(true));
    const sq=$("#sq");
    if(sq){
      sq.oninput = e => { STOPQ=e.target.value; render(true); };
      if(document.activeElement!==sq && STOPQ){ sq.focus();
        sq.setSelectionRange(STOPQ.length,STOPQ.length); }
    }
  }
  if(VIEW==="trips") wireUpload();
  // The tab title is a status surface: a rider with this pinned in a
  // background tab should be able to see that something needs them.
  const acted = ((ST?.findings)||[]).filter(f=>f.verdict.act==="INTERVENE").length;
  const title = acted ? `(${acted}) Dispatch \u2014 action needed` : "Dispatch";
  if(title !== LASTTITLE){ document.title = LASTTITLE = title; }
  const head = document.querySelector(".answer .big");
  if(head && $("#announce").textContent !== head.textContent)
    $("#announce").textContent = head.textContent;

  if(VIEW==="map"){
    const q=$("#mq");
    if(q){
      q.oninput = e => { MQ=e.target.value; render(); };
      if(document.activeElement!==q && MQ) { q.focus();
        q.setSelectionRange(MQ.length,MQ.length); }
    }
    const ob=$("#onlybad"); if(ob) ob.onclick=()=>{MONLYBAD=!MONLYBAD; render();};
    const cs=$("#clearsel"); if(cs) cs.onclick=()=>{MSEL.clear(); render();};
    paintMap();
  }
  if(VIEW==="search"){
    const inp = $("#q");
    inp.focus(); inp.setSelectionRange(Q.length, Q.length);
    inp.oninput = e => { Q = e.target.value; SEL = 0; render(); };
  }
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-v],[data-open],[data-mode],[data-prov],"+
    "[data-follow],[data-run],[data-route],[data-stop],[data-stopback]");
  if(!t) return;
  if(t.dataset.v){ VIEW = t.dataset.v; Q = ""; closeSheet(); return render(); }
  if(t.dataset.mode){ MODE = t.dataset.mode; SEL = 0; return render(); }
  if(t.dataset.open) return open(t.dataset.open);
  if(t.dataset.prov != null) return showPaper(+t.dataset.prov);
  if(t.dataset.stop){ return loadArrivals(t.dataset.stop); }
  if(t.hasAttribute("data-stopback")){
    ARRSTOP=""; ARRIVALS=null; return render(true);
  }
  if(t.dataset.route){
    const id=t.dataset.route;
    MSEL.has(id)?MSEL.delete(id):MSEL.add(id);
    return render();
  }
  if(t.dataset.follow){
    const k = t.dataset.follow;
    FOLLOW.has(k) ? FOLLOW.delete(k) : FOLLOW.add(k);
    saveFollow(); open(k); return render();
  }
  if(t.dataset.run !== undefined) return run();
});
$("#scrim").onclick = closeSheet; $("#sheetx").onclick = closeSheet;
$("#keys").onclick = e => { if(e.target === $("#keys")) $("#keys").hidden = true; };
document.addEventListener("keydown", e => {
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){
    e.preventDefault(); VIEW = "search"; return render(); }
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"");
  if(!typing && (e.key === "?" || (e.key === "/" && e.shiftKey))){
    e.preventDefault();
    const k=$("#keys"); k.hidden = !k.hidden; return;
  }
  if(!typing && "123456".includes(e.key)){
    const order=["now","search","map","stops","trips","evidence"];
    VIEW = order[+e.key - 1]; Q=""; closeSheet(); return render();
  }
  if(e.key === "Escape"){
    if(!$("#keys").hidden){ $("#keys").hidden = true; return; }
    if($("#sheet").classList.contains("on")) return closeSheet();
    if(VIEW==="search" && Q){ Q=""; return render(); }
  }
  if(VIEW==="search" && ["ArrowDown","ArrowUp","Enter"].includes(e.key)){
    const hits = $$(".hit"); if(!hits.length) return;
    if(e.key==="Enter"){ hits[Math.min(SEL,hits.length-1)]?.click(); return; }
    e.preventDefault();
    SEL = Math.max(0, Math.min(hits.length-1, SEL + (e.key==="ArrowDown"?1:-1)));
    hits.forEach((h,i)=>h.setAttribute("aria-selected", i===SEL));
    hits[SEL].scrollIntoView({block:"nearest"});
  }
});

/* --- upload --------------------------------------------------------------- */
function wireUpload(){
  const zone=$("#drop"), input=$("#file"), pick=$("#pick"), out=$("#upres");
  if(!zone) return;
  pick.onclick = () => input.click();
  input.onchange = () => input.files[0] && send(input.files[0]);
  ["dragenter","dragover"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.remove("over"); }));
  zone.addEventListener("drop", e => {
    const f = e.dataTransfer?.files?.[0]; if(f) send(f); });

  async function send(file){
    UPLOAD = {busy:file.name}; render();
    // Always base64 so binary formats (PDF) survive the trip intact.
    const b64 = await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload = () => res(String(r.result).split(",")[1]);
      r.onerror = () => rej(new Error("read failed"));
      r.readAsDataURL(file);
    }).catch(()=>null);
    if(!b64){ UPLOAD={error:"Could not read that file."}; return render(); }
    let r;
    try{
      r = await (await fetch("/api/upload",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:file.name, b64})})).json();
    }catch(e){ r = {error:"upload failed"}; }
    if(r.error){ UPLOAD={error:r.error}; return render(); }
    UPLOAD = r;
    await tick();
    render();
  }
}

/* --- data ----------------------------------------------------------------- */
let _lastCat=0, _lastVeh=0, OFFLINE=false;
async function tick(){
  const now = Date.now();
  try{
    ST = await (await fetch("/api/state")).json();
    OFFLINE = false;
  }catch(e){ OFFLINE = true; paintStatus(); return; }

  // The catalog only moves when findings or legs do, so poll it lazily.
  const legsChanged = (ST.itinerary||[]).length !== ((CAT?.legs)||[]).length;
  if(!CAT || legsChanged || now - _lastCat > 4000){
    try{ CAT = await (await fetch("/api/catalog")).json(); _rkeys=[]; _lastCat=now; }
    catch(e){}
  }
  // Vehicle positions matter on the map; elsewhere a stale count is fine.
  if(VIEW==="stops" && ARRSTOP && now - (window.__lastArr||0) > 6000){
    window.__lastArr = now;
    try{
      ARRIVALS = (await (await fetch("/api/arrivals?stop="+
        encodeURIComponent(ARRSTOP))).json()).arrivals||[];
    }catch(e){}
  }
  const needVeh = VIEW==="map" ? 2000 : 15000;
  if(!MAPDATA || now - _lastVeh > needVeh){
    try{ MAPDATA = await (await fetch("/api/vehicles")).json(); _lastVeh=now; }
    catch(e){}
  }
  paintStatus();
  if(!$("#sheet").classList.contains("on") || VIEW!=="search") render();
  if(ST.status!=="running" && POLL){ clearInterval(POLL); POLL=null; }
}

function paintStatus(){
  $("#f-backend").textContent = OFFLINE ? "offline" : (ST?.backend||"—");
  $("#f-clock").textContent = ST?.clock ? hhmm(ST.clock) : "idle";
}
async function run(){
  const worlds = await (await fetch("/api/scenarios")).json();
  if(!worlds.length) return;
  await fetch("/api/replay",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({scenario:worlds[0].name, speed:900})});
  if(!POLL) POLL = setInterval(tick, 500);
  tick();
}
window.addEventListener("hashchange", () => {
  const t = location.hash.slice(1);
  if(t) open(t); else closeSheet();
});

(async function(){
  await tick();
  if(!(ST?.findings||[]).length) await run();
  // Honour a deep link once data has arrived.
  const t = location.hash.slice(1);
  if(t) setTimeout(() => open(t), 400);
})();
</script>
